
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="player">
    <h1>My Music Player</h1>

  <img
  class="album-art"
  id="album-cover"
  src="images/cover1.jpg"
  alt="Current song cover"
/>


    <h2 id="song-title">Song One</h2>
    <p id="artist">Unknown Artist</p>

    <p id="status" role="status" aria-live="polite"></p>

    <audio id="audio"></audio>

    <div class="time">
      <span id="current-time">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <input type="range" id="progress"
           min="0" max="100" value="0">

    <div class="controls">
      <button id="prev" aria-label="Previous song">⏮</button>
      <button id="play" aria-label="Play music">▶</button>
      <button id="next" aria-label="Next song">⏭</button>
    </div>

    <div class="volume-control">
      <label for="volume">Volume</label>
      <input type="range" id="volume"
             min="0" max="1" step="0.01" value="0.7">
    </div>

    <h3>Playlist</h3>
    <ul id="playlist"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
